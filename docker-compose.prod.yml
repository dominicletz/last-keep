services:
  app:
    image: ghcr.io/dominicletz/last-keep:${LAST_KEEP_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MIX_ENV: prod
      PHX_HOST: ${PHX_HOST:-agentyard.letz.tw}
      PORT: ${PORT:-4000}
      PHX_SERVER: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set in .env}
      HIGHSCORE_PATH: /data/highscores.json
      PERF_KEEP: "1"
    volumes:
      - last-keep-data:/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-4000}/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-agentyard.letz.tw}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health | grep -q ok"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  last-keep-data:
  caddy-data:
  caddy-config:
