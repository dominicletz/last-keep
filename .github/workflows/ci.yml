name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  unit:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.7"
          elixir-version: "1.18.4"
          version-type: strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            assets/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            assets/node_modules
          key: ci-unit-${{ hashFiles('mix.lock', 'assets/package-lock.json') }}

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix assets.setup
      - run: npm ci --prefix assets
      - run: mix assets.build
      - run: mix test --cover
      - run: npm test --prefix assets
      - run: npm run models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery
          path: artifacts/gallery/
          if-no-files-found: warn
      - name: audio stays on the page
        run: |
          if grep -nE "https?://" assets/js/audio.js; then
            echo "audio.js must not load a remote file"
            exit 1
          fi
      - run: npm run check --prefix assets
      - run: npm ci
      - run: node --test e2e/steer.test.js e2e/probe.test.js e2e/roster.test.js e2e/screen.test.js script/ci_budget.test.js

  browser:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - run: npx playwright test --project=functional --grep-invert "six seats hold" --shard=${{ matrix.shard }}/6

  match:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - run: npx playwright test --project=functional -g "six seats hold"

  perf:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - run: npx playwright test --project=perf

  budget:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test script/ci_budget.test.js

  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [unit, browser, perf, match, budget]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: required check stays red unless every job passed
        env:
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          PERF: ${{ needs.perf.result }}
          MATCH: ${{ needs.match.result }}
          BUDGET: ${{ needs.budget.result }}
        run: node script/ci_gate.js
      - name: slowest job stays under 10 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/ci_wall.js
