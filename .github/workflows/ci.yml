name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.7"
          elixir-version: "1.18.4"
          version-type: strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix assets.setup
      - run: npm ci --prefix assets
      - run: mix assets.build
      - run: mix test --cover
      - run: npm test --prefix assets
      - run: npm run models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery
          path: artifacts/gallery/
          if-no-files-found: warn
      - name: audio stays on the page
        run: |
          if grep -nE "https?://" assets/js/audio.js; then
            echo "audio.js must not load a remote file"
            exit 1
          fi
      - run: npm run check --prefix assets
      - run: npm ci
      - run: node --test e2e/steer.test.js e2e/probe.test.js e2e/roster.test.js
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - name: Time the HD-2D scene on SwiftShader
        run: node script/hd2d_swiftshader.mjs
