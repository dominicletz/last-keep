name: Deploy production

on:
  workflow_run:
    workflows: ["Build and push image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (main or a commit SHA)"
        required: false
        default: main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/last-keep' }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag || 'main' }}
      GHCR_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Create deployment directory
        run: >-
          ssh -i "$HOME/.ssh/deploy_key"
          -o IdentitiesOnly=yes
          -p "$DEPLOY_PORT"
          "$DEPLOY_USER@$DEPLOY_HOST"
          "mkdir -p '$DEPLOY_PATH'"

      - name: Copy production files
        run: >-
          scp -i "$HOME/.ssh/deploy_key"
          -o IdentitiesOnly=yes
          -P "$DEPLOY_PORT"
          docker-compose.prod.yml Caddyfile deploy/remote.sh
          "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Stop archived AgentYard and start Last Keep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && IMAGE_TAG='$IMAGE_TAG' GHCR_USERNAME='$GHCR_USERNAME' GITHUB_TOKEN='$GITHUB_TOKEN' DEPLOY_PATH='$DEPLOY_PATH' bash remote.sh"

      - name: Wait until the live game answers
        run: |
          set -eu
          for i in $(seq 1 60); do
            if curl -fsS "https://agentyard.letz.tw/health"; then
              echo "ready after ${i}"
              exit 0
            fi
            sleep 2
          done
          echo "the game did not answer /health"
          exit 1

      - name: Install the browser smoke harness
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prove the live game in a browser
        env:
          BASE_URL: https://agentyard.letz.tw
        run: |
          set -eu
          npm ci
          npx playwright install chromium --with-deps
          npx playwright test
